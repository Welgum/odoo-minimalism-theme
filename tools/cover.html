<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Minimalism — RivetFox marketplace cover</title>
<link rel="stylesheet" href="branding/brand.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif}
.cover{--paper:#fafafa;--ink:#18181b;--muted:#65656f;--line:#d4d4d8;--panel:#fff;--accent:#2563eb;width:1120px;height:560px;position:relative;overflow:hidden;background:var(--paper);color:var(--ink)}
.cover:before{content:"";position:absolute;width:780px;height:780px;left:590px;top:42px;border:1px solid var(--line);border-radius:50%;opacity:.45}
.top{position:absolute;inset:26px 36px auto;display:flex;align-items:center;justify-content:space-between}
.edition{font-size:14px;border:1px solid var(--line);border-radius:30px;padding:10px 16px;color:var(--ink);background:var(--panel)}
.copy{position:absolute;left:38px;top:130px;width:445px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin:0 0 18px;font-weight:600}
h1{font-family:"RivetFox Brand",Arial,sans-serif;font-size:77px;line-height:1.02;letter-spacing:-5px;font-weight:600;margin:0 0 22px}
.tagline{font-size:27px;letter-spacing:-.7px;line-height:1.3;margin:0;color:var(--muted)}
.features{display:flex;gap:8px;margin-top:27px}
.features span{font-size:13px;font-weight:500;border:1px solid var(--line);border-radius:30px;padding:8px 13px;background:var(--panel)}
.stage{position:absolute;left:508px;top:140px;width:670px;height:360px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:0 18px 44px #00000016}
.chrome{height:34px;display:flex;align-items:center;gap:5px;padding:0 13px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--muted);font-size:10px}
.chrome i{height:5px;width:5px;background:var(--line);border-radius:50%}.chrome b{font-weight:400;margin-left:7px;letter-spacing:.8px}
.viewport{position:relative;height:calc(100% - 34px);overflow:hidden}.viewport img{position:absolute;top:0;left:0;width:100%;display:block}
.view-new{clip-path:inset(0 100% 0 0)}
.mode{position:absolute;left:38px;top:411px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--ink)}
.mode-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--panel)}
.bottom{position:absolute;left:38px;right:36px;bottom:24px;display:flex;justify-content:space-between;align-items:center}
.free{font-size:11px;letter-spacing:1px;font-weight:500;color:var(--muted)}
.swatches{display:flex;gap:8px}.swatches i{display:block;width:17px;height:17px;border-radius:50%;background:var(--color);border:1px solid #18181b25}
.thumbnail{width:1000px;height:1210px}
.thumbnail:before{width:1400px;height:1400px;left:120px;top:400px}
.thumbnail .top{inset:34px 42px auto}.thumbnail .edition{font-size:20px;padding:13px 20px}
.thumbnail .copy{left:42px;top:166px;width:916px}.thumbnail .kicker{font-size:17px;letter-spacing:3px;margin-bottom:22px}
.thumbnail h1{font-size:128px;letter-spacing:-8px;margin-bottom:24px}
.thumbnail .tagline{font-size:34px;letter-spacing:-.8px}.thumbnail .tagline br{display:none}
.thumbnail .features{position:absolute;right:0;top:255px;margin:0;gap:10px}.thumbnail .features span{font-size:20px;padding:10px 17px}
.thumbnail .stage{left:42px;top:500px;width:916px;height:562px;border-radius:18px;box-shadow:0 24px 60px #0000001a}
.thumbnail .chrome{height:40px;font-size:13px}.thumbnail .viewport{height:calc(100% - 40px)}
.thumbnail .mode{left:46px;top:430px;font-size:21px;gap:14px}.thumbnail .mode-dot{width:10px;height:10px}
.thumbnail .bottom{left:42px;right:42px;bottom:57px}.thumbnail .free{font-size:17px;letter-spacing:.6px}.thumbnail .swatches{gap:10px}.thumbnail .swatches i{width:28px;height:28px}
</style>
<div class="cover" id="cover">
 <div class="top">
  <div class="rf-lockup"><img src="branding/rivetfox-mark.svg" alt="RivetFox fox"><span class="rf-wordmark">rivetfox<span class="rf-period">.</span></span></div>
  <div class="edition">Odoo <span data-odoo-version>19</span> Community</div>
 </div>
 <div class="copy"><p class="kicker">A calmer Odoo backend</p><h1>Minimalism.</h1><p class="tagline">Less noise.<br> More room to focus.</p><div class="features"><span>7 accents</span><span>Light + dark</span></div></div>
 <div class="stage"><div class="chrome"><i></i><i></i><i></i><b>YOUR EVERYDAY ODOO</b></div><div class="viewport"><img id="old" src="../minimalism_theme/static/description/backend-list.png" alt="Actual Odoo Contacts in light mode"><img id="next" class="view-new" src="../minimalism_theme/static/description/night-mode.png" alt="Alternate appearance of the same Odoo view"></div></div>
 <div class="mode"><i class="mode-dot"></i><span id="mode-label">01 / LIGHT MODE</span></div>
 <div class="bottom"><div class="free">FREE + OPEN SOURCE</div><div class="swatches"><i style="--color:#eab308"></i><i style="--color:#2563eb"></i><i style="--color:#15803d"></i><i style="--color:#7c3aed"></i><i style="--color:#db2777"></i><i style="--color:#c2410c"></i><i style="--color:#dc2626"></i></div></div>
</div>
<script>
const params=new URLSearchParams(location.search);document.querySelector('#cover').classList.toggle('thumbnail',params.get('format')==='thumbnail');
document.querySelectorAll('[data-odoo-version]').forEach(el=>el.textContent=params.get('odoo')||'19');
const scenes=[
 {src:'../minimalism_theme/static/description/backend-list.png',label:'01 / LIGHT MODE',paper:'#fafafa',ink:'#18181b',muted:'#65656f',line:'#d4d4d8',panel:'#ffffff',accent:'#2563eb'},
 {src:'../minimalism_theme/static/description/night-mode.png',label:'02 / DARK MODE',paper:'#09090b',ink:'#fafafa',muted:'#a1a1aa',line:'#3f3f46',panel:'#18181b',accent:'#93c5fd'},
 {src:'marketplace/screens/preset-purple.png',label:'03 / YOUR ACCENT',paper:'#fafafa',ink:'#18181b',muted:'#65656f',line:'#d4d4d8',panel:'#ffffff',accent:'#7c3aed'},
];
window.renderFrame=async time=>{
 const idx=Math.floor(time/3)%3,local=time%3,scene=scenes[idx],next=scenes[(idx+1)%3];
 const progress=Math.max(0,Math.min(1,(local-2.45)/.55)),eased=progress*progress*(3-2*progress);
 for(const name of ['paper','ink','muted','line','panel','accent'])document.querySelector('#cover').style.setProperty('--'+name,scene[name]);
 const lift=Math.sin(Math.PI*Math.min(1,local/.9))**2*3;document.querySelector('h1').style.transform=`translateY(${-lift}px)`;
 document.querySelector('#mode-label').textContent=scene.label;
 const a=document.querySelector('#old'),b=document.querySelector('#next');a.src=scene.src;b.src=next.src;b.style.clipPath=`inset(0 ${(1-eased)*100}% 0 0)`;
 await Promise.all([a.decode(),b.decode()]);
};
</script>
</html>
