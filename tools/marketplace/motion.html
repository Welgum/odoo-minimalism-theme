<!doctype html><html lang="en"><meta charset="utf-8"><title>Minimalism — appearance comparison</title><style>*{box-sizing:border-box}body{margin:0;width:1120px;height:760px;background:#fafafa;color:#18181b;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.top{height:123px;padding:28px 40px;display:flex;align-items:center;justify-content:space-between}h1{font-size:28px;letter-spacing:-1px;font-weight:600;margin:0}p{color:#71717a;font-size:14px;margin:5px 0 0}.label{border:1px solid #d4d4d8;border-radius:20px;padding:6px 15px;background:white;font-size:13px}.frame{margin:0 40px;width:1040px;height:593px;overflow:hidden;border:1px solid #d4d4d8;border-radius:10px;box-shadow:0 8px 30px #18181b08}img{display:block;width:100%}.foot{position:absolute;bottom:10px;width:100%;text-align:center;color:#71717a;font-size:11px}</style><body><div class="top"><div><h1 id="title">A workspace for every hour.</h1><p id="subtitle">Personal light and dark mode. Your open work stays right where it is.</p></div><span class="label" id="label">Light mode</span></div><div class="frame"><img id="screen" alt="Real Odoo appearance comparison"></div><div class="foot">Minimalism · Odoo 19 Community · Animated comparison of real product captures</div><script>
const accents=new URLSearchParams(location.search).get('type')==='accents';
const names=accents?['Yellow','Blue','Green','Purple','Pink','Orange','Red']:['Light mode','Dark mode'];
const files=accents?names.map(n=>'screens/preset-'+n.toLowerCase()+'.png'):['../../minimalism_theme/static/description/backend-list.png','../../minimalism_theme/static/description/night-mode.png'];
files.forEach(src=>{const img=new Image();img.src=src});
if(accents){document.querySelector('#title').textContent='One palette. A shared identity.';document.querySelector('#subtitle').textContent='Seven administrator-managed accents. Quiet surfaces in every preset.';}
window.renderFrame=async t=>{const i=Math.floor(t/(accents?2:4))%files.length;document.querySelector('#label').textContent=names[i];const img=document.querySelector('#screen');img.src=files[i];await img.decode();};
</script></body></html>
