name: minimalism-theme-16
# Local disposable development stack. Bind mounts avoid consuming Docker's disk.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - ./dist/compose/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 2s
      timeout: 3s
      retries: 30
  odoo:
    image: odoo:16.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MIN_DEV_PORT:-19066}:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - .:/mnt/extra-addons:ro
      - ./dist/compose/odoodata:/var/lib/odoo
    command: ["odoo", "-d", "minimalism16", "--db-filter=^minimalism16.*$", "--http-interface=0.0.0.0"]
